name: Publicar Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo install react-dom react-native-web
      - run: npx expo export --platform web
      - run: pip install pillow
      - run: |
          python3 -c '
          from PIL import Image
          import json
          im = Image.open("public/icon.png").convert("RGBA")
          im.resize((192, 192)).save("dist/icon-192.png", "PNG")
          im.resize((512, 512)).save("dist/icon-512.png", "PNG")
          manifest = {
              "name": "DeliveryYa",
              "short_name": "DeliveryYa",
              "description": "Comidas y encomiendas en moto",
              "start_url": "/DeliveryYa-app/",
              "scope": "/DeliveryYa-app/",
              "display": "standalone",
              "background_color": "#ffffff",
              "theme_color": "#FF5500",
              "icons": [
                  {"src": "/DeliveryYa-app/icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any"},
                  {"src": "/DeliveryYa-app/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any"}
              ]
          }
          open("dist/manifest.json", "w").write(json.dumps(manifest, indent=2))
          '
      - run: sed -i 's|</head>|<link rel="manifest" href="/DeliveryYa-app/manifest.json" /></head>|' dist/index.html
      - run: cp DeliveryYa.apk dist/DeliveryYa.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
